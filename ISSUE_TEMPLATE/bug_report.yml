name: 🐛 Bug report
description: Something doesn't work as expected
title: "[Bug]: "
labels: ["bug"]
assignees: ["lukatinarelli"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search the [existing issues](https://github.com/bspwmctl/bspwmctl/issues) first, it may already be known.
        For security issues, follow the [security policy](https://github.com/bspwmctl/.github/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `bspwmctl install --standard`
        2. Log in to bspwm
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: bspwmctl version
      description: Output of `bspwmctl --version`
      placeholder: bspwmctl 0.2.0-beta.1
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: Ubuntu 24.04, Arch Linux, Fedora 43...
    validations:
      required: true

  - type: dropdown
    id: installed-from
    attributes:
      label: Installed from
      options:
        - Release package (.deb, .rpm, Arch)
        - Git repository
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Installation mode
      options:
        - minimal
        - standard
        - all
        - Not relevant
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste the full output of the command that failed. It will be formatted automatically.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, config changes you made, anything else that may help.
